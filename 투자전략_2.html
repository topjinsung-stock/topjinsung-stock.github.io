<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 수익 전략 리포트</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100">
    <div id="root"></div>

    <script type="text/babel">
        // 아이콘 컴포넌트
        const PieChart = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        );
        const RefreshCw = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        );
        const ShieldCheck = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
        );
        const ArrowRight = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const Layers = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        );
        const Star = ({ size = 24, color = "currentColor" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        );

        const StrategyReport = () => {
            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    <div className="max-w-3xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/50 relative">
                        
                        {/* Header Section */}
                        <div className="bg-gradient-to-r from-violet-600 via-purple-600 to-indigo-600 text-white p-12 text-center relative overflow-hidden">
                            {/* Decorative Circles */}
                            <div className="absolute top-0 left-0 w-32 h-32 bg-white/10 rounded-full -translate-x-1/2 -translate-y-1/2 blur-2xl"></div>
                            <div className="absolute bottom-0 right-0 w-40 h-40 bg-pink-500/20 rounded-full translate-x-1/3 translate-y-1/3 blur-xl"></div>
                            
                            <div className="relative z-10">
                                <h1 className="text-5xl font-black mb-4 tracking-tight drop-shadow-md">2026년 수익 전략</h1>
                                <div className="inline-block bg-white/20 backdrop-blur-sm px-6 py-2 rounded-full border border-white/30">
                                    <p className="text-yellow-300 font-bold text-lg flex items-center gap-2">
                                        <Star size={20} className="fill-yellow-300" />
                                        선택과 집중, 그리고 철저한 원칙
                                        <Star size={20} className="fill-yellow-300" />
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="p-8 space-y-10 bg-white/80">
                            
                            {/* Section 1: Portfolio Composition */}
                            <div className="relative">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="bg-gradient-to-br from-blue-500 to-cyan-400 p-3 rounded-xl text-white shadow-lg shadow-blue-500/30">
                                        <PieChart size={28} />
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600">포트폴리오 구성</h2>
                                </div>
                                
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="group bg-gradient-to-br from-slate-50 to-white p-7 rounded-2xl border border-slate-200 hover:border-blue-400 hover:shadow-xl hover:shadow-blue-100 transition-all duration-300">
                                        <div className="flex justify-between items-start mb-3">
                                            <span className="text-slate-500 font-bold uppercase tracking-wider text-xs">운영 규모</span>
                                            <span className="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full font-bold">Strict Limit</span>
                                        </div>
                                        <div className="text-4xl font-black text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">10종목 <span className="text-xl font-medium text-slate-400">내외</span></div>
                                        <p className="text-slate-600 font-medium">백화점식 매매 지양<br/>관리 가능한 종목 수 유지</p>
                                    </div>
                                    <div className="group bg-gradient-to-br from-emerald-50 to-white p-7 rounded-2xl border border-emerald-100 hover:border-emerald-400 hover:shadow-xl hover:shadow-emerald-100 transition-all duration-300">
                                        <div className="flex justify-between items-start mb-3">
                                            <span className="text-emerald-600 font-bold uppercase tracking-wider text-xs">운영 방식</span>
                                            <Layers size={24} className="text-emerald-500 group-hover:scale-110 transition-transform" />
                                        </div>
                                        <div className="text-3xl font-black text-emerald-800 mb-2 group-hover:text-emerald-600 transition-colors">단기 + 중기 병행</div>
                                        <p className="text-emerald-700 font-medium">자금 회전율(단기)과<br/>수익률(중기)의 조화</p>
                                    </div>
                                </div>
                            </div>

                            {/* Section 2: Operation Rules */}
                            <div className="relative">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="bg-gradient-to-br from-purple-500 to-pink-500 p-3 rounded-xl text-white shadow-lg shadow-purple-500/30">
                                        <RefreshCw size={28} />
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600">매매 운영 시스템</h2>
                                </div>

                                <div className="flex flex-col md:flex-row gap-0 md:gap-4 items-center justify-center bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-8 border border-indigo-100 shadow-inner mb-6 relative overflow-hidden">
                                    <div className="text-center md:text-left flex-1 relative z-10">
                                        <div className="inline-block bg-white text-indigo-600 text-xs font-bold px-3 py-1 rounded-full mb-2 shadow-sm border border-indigo-100">STEP 01</div>
                                        <strong className="block text-2xl text-slate-800 font-black">수익 종목 완매도 후</strong>
                                    </div>
                                    
                                    <div className="bg-white p-3 rounded-full shadow-lg border border-purple-100 z-10 my-4 md:my-0">
                                        <ArrowRight className="text-purple-500 rotate-90 md:rotate-0" size={32} />
                                    </div>
                                    
                                    <div className="text-center md:text-left flex-1 relative z-10 pl-0 md:pl-4">
                                        <div className="inline-block bg-white text-purple-600 text-xs font-bold px-3 py-1 rounded-full mb-2 shadow-sm border border-purple-100">STEP 02</div>
                                        <strong className="block text-2xl text-purple-700 font-black">신규 종목 편입</strong>
                                    </div>
                                </div>
                                
                                <div className="bg-gradient-to-r from-blue-500 to-indigo-600 p-6 rounded-2xl shadow-lg shadow-blue-500/20 text-white transform hover:-translate-y-1 transition-transform">
                                    <div className="flex items-start gap-4">
                                        <div className="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                                            <Star className="text-yellow-300 fill-yellow-300" size={24} />
                                        </div>
                                        <div>
                                            <p className="font-bold text-lg text-blue-50 mb-1">책임 리딩 서비스</p>
                                            <p className="text-blue-100 font-medium leading-relaxed">절익가를 잡아드린 종목은 목표 달성 시까지 <span className="text-white font-bold underline decoration-yellow-400 decoration-2 underline-offset-4">끝까지 리딩</span>해 드립니다.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Section 3: Risk Management */}
                            <div>
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="bg-gradient-to-br from-red-500 to-orange-500 p-3 rounded-xl text-white shadow-lg shadow-red-500/30">
                                        <ShieldCheck size={28} />
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-orange-600">공통 필수 원칙 : 리스크 관리</h2>
                                </div>

                                <div className="bg-white rounded-2xl p-8 border-2 border-red-100 shadow-xl relative overflow-hidden group hover:border-red-300 transition-colors">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-red-50 rounded-full -translate-y-1/2 translate-x-1/2 opacity-50 group-hover:scale-110 transition-transform duration-500"></div>
                                    
                                    <p className="text-slate-600 font-bold text-center mb-8 text-lg relative z-10">성공 투자의 9할은 <span className="text-red-500 underline decoration-4 decoration-red-200">원칙 준수</span>에 있습니다.</p>
                                    
                                    <div className="flex flex-col sm:flex-row justify-center gap-6 relative z-10">
                                        <div className="flex-1 bg-gradient-to-br from-red-50 to-white px-6 py-5 rounded-2xl shadow-md border border-red-200 hover:shadow-lg hover:shadow-red-100/50 transition-all text-center">
                                            <span className="text-red-500 text-xs font-black tracking-widest block mb-2">LOSS CUT</span>
                                            <span className="text-2xl font-black text-slate-800">손절가 준수</span>
                                        </div>
                                        <div className="flex-1 bg-gradient-to-br from-emerald-50 to-white px-6 py-5 rounded-2xl shadow-md border border-emerald-200 hover:shadow-lg hover:shadow-emerald-100/50 transition-all text-center">
                                            <span className="text-emerald-500 text-xs font-black tracking-widest block mb-2">PROFIT TAKE</span>
                                            <span className="text-2xl font-black text-slate-800">절익가 준수</span>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-8 text-center relative z-10">
                                        <span className="inline-block bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold text-sm shadow-sm">
                                            "감정에 휘둘리지 않고 기계적으로 대응합시다"
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Footer */}
                        <div className="bg-slate-50 p-6 text-center text-slate-400 text-xs font-medium border-t border-slate-100">
                            2026 Portfolio Strategy Report
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StrategyReport />);
    </script>
</body>
</html>
