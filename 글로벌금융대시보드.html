<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>글로벌 주요 에너지 & FX 실시간 모니터</title>
    
    <!-- 1. 스타일 및 폰트 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 2. React 핵심 라이브러리 (안정화 CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Babel Standalone에 명시적인 클래식 런타임 프리셋 정의 -->
    <script>
        Babel.registerPreset('classic-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <!-- 4. 정의한 프리셋을 명시하여 React 스크립트 실행 -->
    <script type="text/babel" data-presets="classic-react">
        const { useState, useEffect, memo } = React;

        // 핵심 3대 지표 정의
        const MARKET_ASSETS = [
            { symbol: "TVC:USOIL", title: "WTI 크루드 오일 선물", icon: "🛢️", desc: "미국 서부 텍사스산 원유 실시간 시세 (NYMEX)" },
            { symbol: "TVC:UKOIL", title: "브렌트유 선물", icon: "⛽", desc: "북해산 글로벌 국제 원유 가격 표준 (ICE)" },
            { symbol: "FX_IDC:USDKRW", title: "원 / 달러 환율", icon: "💵", desc: "미국 달러화 대비 원화 실시간 기준 가치 (FOREX)" }
        ];

        // 예외 복구 경계면 레이아웃 컴포넌트
        class WidgetErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            static getDerivedStateFromError() {
                return { hasError: true };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="bg-slate-900/60 border border-red-900/20 rounded-3xl p-6 flex flex-col items-center justify-center text-center h-80">
                            <p className="text-red-400 font-semibold text-xs mb-2">💡 미니 차트 로드 제한됨</p>
                            <span className="text-[10px] text-slate-500 max-w-xs">
                                추적 방지 또는 보안 필터 확장 기능이 TradingView 차트 로딩을 차단했을 수 있습니다.
                            </span>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // 최상단 실시간 흐름형 티커 (WTI, 브렌트, 원달러 특화)
        const SafeTickerTape = memo(() => {
            const tickerOptions = {
                "symbols": [
                    { "proName": "FX_IDC:USDKRW", "title": "USD/KRW" },
                    { "proName": "TVC:USOIL", "title": "WTI 원유" },
                    { "proName": "TVC:UKOIL", "title": "브렌트유" }
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": false,
                "displayMode": "adaptive",
                "locale": "kr"
            };

            const encodedOptions = encodeURIComponent(JSON.stringify(tickerOptions));
            const iframeUrl = `https://s.tradingview.com/embed-widget/ticker-tape/?locale=kr#${encodedOptions}`;

            return (
                <div className="w-full h-12 bg-slate-950 border-b border-slate-900 sticky top-0 z-50 overflow-hidden">
                    <iframe 
                        src={iframeUrl}
                        style={{ width: '100%', height: '100%', border: 'none', overflow: 'hidden' }}
                        title="TradingView Ticker Tape Widget"
                        scrolling="no"
                    />
                </div>
            );
        });

        // 미니 변동 추이 차트 위젯 (Iframe 방식)
        const SafeMiniChart = memo(({ symbol, title, desc, icon, onExpand }) => {
            const chartOptions = {
                "symbol": symbol,
                "width": "100%",
                "height": "100%",
                "locale": "kr",
                "dateRange": "1M",
                "colorTheme": "dark",
                "trendLineColor": "#3b82f6",
                "underLineColor": "rgba(59, 130, 246, 0.08)",
                "underLineBottomColor": "rgba(0, 0, 0, 0)",
                "isTransparent": true,
                "autosize": true
            };

            const encodedOptions = encodeURIComponent(JSON.stringify(chartOptions));
            const iframeUrl = `https://s.tradingview.com/embed-widget/mini-symbol-overview/?locale=kr#${encodedOptions}`;

            return (
                <div className="bg-slate-900/40 backdrop-blur-md hover:bg-slate-900/80 transition-all duration-300 rounded-3xl p-5 border border-slate-800/80 hover:border-blue-500/50 flex flex-col h-80 group relative overflow-hidden shadow-lg">
                    <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2.5">
                            <span className="text-2xl">{icon}</span>
                            <div>
                                <h3 className="text-sm font-bold text-slate-100 group-hover:text-blue-400 transition-colors">{title}</h3>
                                <p className="text-[10px] text-slate-500 font-mono uppercase tracking-wider mt-0.5">{symbol}</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => onExpand(symbol, title)}
                            className="p-2 bg-slate-800/60 hover:bg-blue-600 rounded-xl text-slate-400 hover:text-white transition-all shadow-md active:scale-95"
                            title="상세 차트 열기"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                            </svg>
                        </button>
                    </div>
                    
                    <p className="text-xs text-slate-400 mb-4 line-clamp-1">{desc}</p>

                    <div className="flex-1 w-full relative overflow-hidden rounded-2xl bg-slate-950/40 border border-slate-900/60">
                        <iframe 
                            src={iframeUrl}
                            style={{ width: '100%', height: '100%', border: 'none' }}
                            title={`TradingView Chart for ${symbol}`}
                            scrolling="no"
                        />
                    </div>
                </div>
            );
        });

        // 팝업 상세 정밀 차트 분석 모달
        const AdvancedChartModal = ({ symbol, title, onClose }) => {
            const iframeUrl = `https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(symbol)}&theme=dark&locale=kr&style=1&timezone=Asia%2FSeoul&interval=60&studies=%5B%5D&calendar=true`;
            
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in">
                    <div className="bg-slate-950 w-full max-w-6xl h-[80vh] rounded-3xl flex flex-col border border-slate-800 shadow-2xl overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-900 bg-slate-950/50">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">{MARKET_ASSETS.find(a => a.symbol === symbol)?.icon}</span>
                                <div>
                                    <h2 className="text-base font-bold text-white">{title} 인터랙티브 차트 분석</h2>
                                    <p className="text-[10px] text-slate-500 font-mono uppercase">{symbol}</p>
                                </div>
                            </div>
                            <button 
                                onClick={onClose}
                                className="p-2 bg-slate-900 hover:bg-slate-800 rounded-full text-slate-400 hover:text-white transition-colors"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <div className="flex-1 relative bg-slate-950">
                            <iframe 
                                src={iframeUrl}
                                style={{ width: '100%', height: '100%', border: 'none' }}
                                title="TradingView Interactive Full Chart"
                            />
                        </div>
                    </div>
                </div>
            );
        };

        // 메인 애플리케이션 컴포넌트
        const App = () => {
            const [activeChart, setActiveChart] = useState(null);
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="min-h-screen flex flex-col pb-16 bg-[#030712]">
                    <SafeTickerTape />

                    {/* 헤더 영역 */}
                    <header className="px-4 md:px-8 pt-12 pb-8 max-w-6xl mx-auto w-full">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 border-b border-slate-900 pb-6">
                            <div className="space-y-2">
                                <div className="flex items-center gap-2.5">
                                    <h1 className="text-2xl md:text-3xl font-black text-white tracking-tight">
                                        ENERGY & <span className="text-blue-500">FX PORTAL</span>
                                    </h1>
                                    <span className="px-2 py-0.5 bg-blue-500/10 text-blue-400 text-[9px] font-black rounded border border-blue-500/20 tracking-wider">REALTIME</span>
                                </div>
                                <p className="text-slate-400 text-xs font-medium">글로벌 3대 핵심 거시 금융 지표: WTI 원유, 브렌트 원유 및 원/달러 실시간 대시보드</p>
                            </div>

                            {/* 시장 표준 시간 출력 */}
                            <div className="flex items-center gap-4 bg-slate-900/30 px-5 py-3 rounded-2xl border border-slate-800/60 shadow-xl w-full sm:w-auto">
                                <div className="text-left">
                                    <div className="text-[9px] text-slate-500 font-bold uppercase mb-0.5 tracking-wider">시장 기준 시각</div>
                                    <div className="text-slate-200 font-mono text-sm font-bold tracking-wider">
                                        {currentTime.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' })} {currentTime.toLocaleTimeString('ko-KR', { hour12: false })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* 메인 콘텐츠 그리드 (3단 고정 배치) */}
                    <main className="flex-1 px-4 md:px-8 max-w-6xl mx-auto w-full">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {MARKET_ASSETS.map((asset) => (
                                <div key={asset.symbol} className="animate-fade-in">
                                    <WidgetErrorBoundary>
                                        <SafeMiniChart 
                                            symbol={asset.symbol}
                                            title={asset.title}
                                            desc={asset.desc}
                                            icon={asset.icon}
                                            onExpand={(sym, tit) => setActiveChart({ symbol: sym, title: tit })}
                                        />
                                    </WidgetErrorBoundary>
                                </div>
                            ))}
                        </div>

                        {/* 바닥 저작권 및 시스템 안내 공지 */}
                        <footer className="mt-20 py-8 border-t border-slate-900 text-center space-y-2">
                            <p className="text-slate-600 text-[10px] uppercase tracking-[0.2em] font-bold">
                                Pure Market Focus &bull; TradingView Embed API
                            </p>
                            <p className="text-slate-600 text-[10px] max-w-xl mx-auto leading-relaxed">
                                본 정보 화면은 브라우저의 전원 및 트랙 필터 차단 등에 영향을 받지 않는 독립적인 Iframe 모듈로 실시간으로 작동합니다. 상세 분석을 원하는 종목의 우측 상단 돋보기 버튼을 클릭해 전체 화면으로 차트를 활용해 보세요.
                            </p>
                        </footer>
                    </main>

                    {/* 실시간 팝업 상세 모달 */}
                    {activeChart && (
                        <AdvancedChartModal 
                            symbol={activeChart.symbol} 
                            title={activeChart.title}
                            onClose={() => setActiveChart(null)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
