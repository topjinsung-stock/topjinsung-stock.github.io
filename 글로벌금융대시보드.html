<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>글로벌 금융 실시간 대시보드</title>
    
    <!-- 1. 스타일 및 폰트 설정 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .loader-container {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out;
        }

        /* 위젯 컨테이너 최소 높이 확보 */
        .tv-widget-box { min-height: 250px; }
    </style>
</head>
<body>
    <!-- 초기 로딩 화면 -->
    <div id="page-loader" class="loader-container">
        <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <p class="text-blue-400 font-medium animate-pulse text-sm">데이터를 연결하는 중입니다...</p>
    </div>

    <div id="root"></div>

    <!-- 2. 필수 라이브러리 로드 (순서 중요) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TradingView 라이브러리를 미리 로드 -->
    <script src="https://s3.tradingview.com/tv.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo, useCallback } = React;

        const MARKET_DATA = {
            commodities: [
                { symbol: "TVC:USOIL", title: "WTI 원유 (미국)" },
                { symbol: "TVC:UKOIL", title: "브랜트유 (영국)" },
                { symbol: "FX_IDC:USDKRW", title: "원/달러 환율" },
                { symbol: "TVC:GOLD", title: "국제 금" },
                { symbol: "TVC:SILVER", title: "국제 은" },
                { symbol: "BINANCE:BTCUSDT", title: "비트코인 (USDT)" }
            ]
        };

        const Icons = {
            Maximize: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>,
            Activity: () => <svg className="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
            Chart: () => <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        };

        // 1. 상단 티커 테이프 위젯
        const TickerTape = memo(() => {
            const containerRef = useRef(null);
            useEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                container.innerHTML = '';
                const script = document.createElement("script");
                script.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
                script.async = true;
                script.innerHTML = JSON.stringify({
                    "symbols": [
                        { "proName": "FX_IDC:USDKRW", "title": "USD/KRW" },
                        { "proName": "TVC:USOIL", "title": "WTI 원유" },
                        { "proName": "TVC:GOLD", "title": "금" },
                        { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
                        { "proName": "INDEX:SPX", "title": "S&P 500" }
                    ],
                    "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": false, "displayMode": "adaptive", "locale": "kr"
                });
                container.appendChild(script);
            }, []);
            return <div className="w-full h-12 bg-slate-950 border-b border-slate-800 sticky top-0 z-50 overflow-hidden" ref={containerRef}></div>;
        });

        // 2. 미니 차트 위젯 (메인 대시보드용)
        const MiniChart = ({ symbol, title, onExpand }) => {
            const containerRef = useRef(null);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                container.innerHTML = '';
                
                const script = document.createElement("script");
                script.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
                script.async = true;
                script.innerHTML = JSON.stringify({
                    "symbol": symbol, "width": "100%", "height": "100%", "locale": "kr", "dateRange": "1D",
                    "colorTheme": "dark", "trendLineColor": "#3b82f6", "underLineColor": "rgba(59, 130, 246, 0.15)",
                    "underLineBottomColor": "rgba(59, 130, 246, 0)", "isTransparent": true, "autosize": true
                });
                container.appendChild(script);
                setIsLoaded(true);
            }, [symbol]);

            return (
                <div className="bg-slate-900/50 backdrop-blur-md hover:bg-slate-800/60 transition-all duration-300 rounded-2xl p-5 border border-slate-800 hover:border-blue-500/40 shadow-xl flex flex-col h-72 group">
                    <div className="flex justify-between items-start mb-4">
                        <div>
                            <h3 className="text-sm font-bold text-slate-100 group-hover:text-blue-400 transition-colors">{title}</h3>
                            <span className="text-[10px] text-slate-500 font-mono uppercase">{symbol}</span>
                        </div>
                        <button 
                            onClick={() => onExpand(symbol, title)}
                            className="p-2 bg-slate-800 hover:bg-blue-600 rounded-lg text-slate-400 hover:text-white transition-all shadow-lg active:scale-90"
                        >
                            <Icons.Maximize />
                        </button>
                    </div>
                    <div className="flex-1 w-full relative overflow-hidden rounded-lg tv-widget-box">
                        <div ref={containerRef} className="w-full h-full"></div>
                        {!isLoaded && <div className="absolute inset-0 flex items-center justify-center bg-slate-900/20 animate-pulse" />}
                    </div>
                </div>
            );
        };

        // 3. 고성능 상세 차트 모달
        const AdvancedChartModal = ({ symbol, title, onClose }) => {
            const chartId = `adv-chart-${symbol.replace(/[:.]/g, '-')}`;
            
            useEffect(() => {
                // TradingView 라이브러리가 로드되었는지 확인 후 실행
                const initTimer = setTimeout(() => {
                    if (window.TradingView) {
                        new window.TradingView.widget({
                            "autosize": true, "symbol": symbol, "interval": "60", "timezone": "Asia/Seoul",
                            "theme": "dark", "style": "1", "locale": "kr", "toolbar_bg": "#0f172a",
                            "enable_publishing": false, "hide_side_toolbar": false, "allow_symbol_change": true,
                            "container_id": chartId, "backgroundColor": "#020617", "gridColor": "rgba(30, 41, 59, 0.1)"
                        });
                    }
                }, 200);

                document.body.style.overflow = 'hidden';
                return () => {
                    document.body.style.overflow = 'auto';
                    clearTimeout(initTimer);
                };
            }, [symbol, chartId]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in">
                    <div className="bg-slate-950 w-full h-full max-w-7xl rounded-2xl flex flex-col border border-slate-800 shadow-2xl overflow-hidden">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-900">
                            <div className="flex items-center gap-3">
                                <Icons.Activity />
                                <h2 className="text-lg font-bold text-white">{title} 실시간 분석</h2>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-800 rounded-full text-slate-400 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="flex-1 relative">
                            <div id={chartId} className="absolute inset-0 w-full h-full">
                                <div className="flex items-center justify-center h-full text-slate-600">전문 차트 정보를 불러오고 있습니다...</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. 메인 애플리케이션
        const App = () => {
            const [activeChart, setActiveChart] = useState(null);
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                // 페이지 로딩 화면 제거
                const loader = document.getElementById('page-loader');
                if (loader) {
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 500);
                    }, 800);
                }

                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="min-h-screen flex flex-col">
                    <TickerTape />

                    <header className="px-6 pt-12 pb-8 max-w-7xl mx-auto w-full">
                        <div className="flex flex-col md:flex-row justify-between items-end gap-6">
                            <div className="space-y-2">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-3xl md:text-4xl font-black text-white tracking-tight">
                                        GLOBAL <span className="text-blue-500">MARKET</span>
                                    </h1>
                                    <span className="px-2 py-0.5 bg-blue-500/10 text-blue-400 text-[10px] font-bold rounded border border-blue-500/20 uppercase tracking-widest">PRO-VERSION</span>
                                </div>
                                <p className="text-slate-400 text-sm">주요 원자재, 환율 및 암호화폐 실시간 금융 모니터링 시스템</p>
                            </div>
                            
                            <div className="flex items-center gap-4 bg-slate-900/80 px-5 py-3 rounded-2xl border border-slate-800 shadow-xl">
                                <div className="text-right">
                                    <div className="text-[10px] text-slate-500 font-bold uppercase mb-0.5 tracking-tighter">Market Local Time</div>
                                    <div className="text-slate-100 font-mono text-lg font-semibold tabular-nums leading-none">
                                        {currentTime.toLocaleTimeString('ko-KR', { hour12: false })}
                                    </div>
                                </div>
                                <div className="w-[1px] h-8 bg-slate-800 mx-1"></div>
                                <div className="text-slate-400 font-medium text-xs">
                                    {currentTime.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' })}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 px-6 pb-20 max-w-7xl mx-auto w-full">
                        <div className="mb-8 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-blue-500/10 rounded-xl">
                                    <Icons.Chart />
                                </div>
                                <h2 className="text-xl font-bold text-slate-100">실시간 대시보드</h2>
                            </div>
                            <button 
                                onClick={() => window.location.reload()}
                                className="flex items-center gap-2 text-xs text-slate-500 hover:text-blue-400 transition-colors"
                            >
                                <Icons.Refresh /> 데이터 새로고침
                            </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {MARKET_DATA.commodities.map((item, idx) => (
                                <div key={idx} className="animate-fade-in" style={{animationDelay: `${idx * 0.1}s`}}>
                                    <MiniChart 
                                        symbol={item.symbol} 
                                        title={item.title} 
                                        onExpand={(s, t) => setActiveChart({symbol: s, title: t})} 
                                    />
                                </div>
                            ))}
                        </div>

                        <footer className="mt-24 py-10 border-t border-slate-900 text-center space-y-3">
                            <p className="text-slate-600 text-[10px] uppercase tracking-[0.2em] font-bold">
                                Optimized Real-time Streaming &bull; TradingView Interactive
                            </p>
                            <p className="text-slate-700 text-[10px] max-w-2xl mx-auto leading-relaxed">
                                본 대시보드는 실시간 시장 데이터를 제공하며, 브라우저의 '추적 방지' 또는 '광고 차단' 확장 프로그램이 
                                활성화된 경우 차트 로드가 제한될 수 있습니다. 화면이 보이지 않을 경우 새로고침(F5)을 권장합니다.
                            </p>
                        </footer>
                    </main>

                    {activeChart && (
                        <AdvancedChartModal 
                            symbol={activeChart.symbol} 
                            title={activeChart.title} 
                            onClose={() => setActiveChart(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
